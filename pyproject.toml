[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "oncomyeloid-fx"
version = "0.1.0"
description = "Reproducible descriptive macrophage/T-cell evidence research runner"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = []

[project.scripts]
oncomyeloid-fx = "oncomyeloid_fx.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
